name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # Sparse checkout: skip the 2.5 GB cdn/ image/audio tree that is only
          # used as a GitHub raw CDN source, not needed at build time.
          # cdn/pokemoncontent/data is included because data.ts reads the gzip
          # bundle from there (eliminates the 109 MB LFS file from the pipeline).
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            src
            public
            scripts
            cdn/pokemoncontent/data

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run cf:build
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
